name: Build y despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez; si llegan varios pushes seguidos se encolan en orden.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_DIR: /home/deploy/app

jobs:
  build:
    name: Construir y subir imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de imagen y tag
        id: vars
        run: |
          # GHCR exige nombres en minúsculas
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF

      - name: Copiar docker-compose.yml y Caddyfile
        run: |
          ssh vps "mkdir -p '$APP_DIR'"
          scp deploy/docker-compose.yml deploy/Caddyfile "vps:$APP_DIR/"

      - name: Pull, up y limpieza
        run: |
          ssh vps "set -e
            cd '$APP_DIR'
            export APP_TAG=latest
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || docker compose restart caddy
            docker image prune -f
            docker compose ps"
          echo "Desplegada la imagen ${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha }}"

      - name: Borrar llave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
